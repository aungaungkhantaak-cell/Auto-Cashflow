<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auto Cash Flow</title>
<style>
:root{--ink:#102b45;--muted:#6d7c89;--paper:#f7f4ee;--card:#fffdf9;--line:#e5e2da;--mint:#dff4e9;--green:#168561;--coral:#f9e2df;--red:#c7473d;--sky:#e4f1f8;--amber:#b87920;--shadow:0 8px 24px #102b4512}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 70px}.brand{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}.brand small{display:block;color:var(--green);font-size:10px;font-weight:900;letter-spacing:2px}.brand h1{margin:3px 0 0;font-size:27px}.date{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800}.hero{background:var(--ink);color:white;border-radius:24px;padding:22px 20px;box-shadow:var(--shadow);margin-bottom:12px}.hero small{color:#b9d5df}.hero h2{font-size:29px;margin:8px 0}.hero .sub{color:#bde6d2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 2px 8px #102b4507}.metric label{display:block;color:var(--muted);font-size:11px;font-weight:800}.metric b{display:block;font-size:20px;margin-top:5px}.income b,.positive{color:var(--green)}.expense b,.negative{color:var(--red)}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section h3{margin:0;font-size:18px}.hint{color:var(--muted);font-size:11px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.filter-row{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip,button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.chip.active,button.primary{background:var(--ink);color:white;border-color:var(--ink)}button.green{background:var(--green);border-color:var(--green);color:white}.custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.field{display:block;color:var(--muted);font-size:11px;font-weight:800}.field input,.field select,.field textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font:inherit;color:var(--ink)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.focus{background:var(--sky);display:flex;justify-content:space-between;align-items:center}.focus .amounts{text-align:right;font-size:12px;line-height:1.7}.budget-top{display:flex;justify-content:space-between;align-items:center}.toggle{display:flex;background:var(--paper);padding:3px;border-radius:999px}.toggle button{border:0;background:transparent;padding:6px 10px;font-size:11px}.toggle button.active{background:var(--ink);color:#fff}.progress{height:8px;background:var(--paper);border-radius:10px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green);border-radius:10px}.progress i.warn{background:var(--amber)}.progress i.danger{background:var(--red)}.health{font-size:11px;font-weight:900;padding:7px 10px;border-radius:999px}.health.green{background:var(--mint);color:var(--green)}.health.amber{background:#fff0cf;color:var(--amber)}.health.red{background:var(--coral);color:var(--red)}.bar-row{display:grid;grid-template-columns:90px 1fr 76px;gap:7px;align-items:center;margin:9px 0;font-size:11px}.bar{height:8px;background:var(--paper);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#4d86a8}.record,.trip{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.record:last-child,.trip:last-child{border-bottom:0}.record small,.trip small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.record .amount{text-align:right;font-weight:900}.record .tools{display:flex;gap:5px;justify-content:flex-end;margin-top:5px}.record .tools button{padding:4px 7px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:20px;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-grid .full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;margin-top:10px}.trip b{font-size:14px}.trip-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:11px}.trip-stats div{background:var(--paper);padding:8px;border-radius:10px}.trip-stats b{display:block;margin-top:4px}.danger-btn{color:var(--red)}@media(max-width:430px){main{padding:14px 10px 60px}.bar-row{grid-template-columns:73px 1fr 66px;font-size:10px}.custom,.form-grid{grid-template-columns:1fr}.hero h2{font-size:25px}}
</style>
</head>
<body>
<main>
  <header class="brand"><div><small>AUTO CASH FLOW</small><h1>ငွေစာရင်း</h1><span class="hint">ဝင်ငွေ၊ ထွက်ငွေနှင့် Budget ကို တစ်နေရာတည်းတွင် စောင့်ကြည့်ပါ</span></div><div class="date">▣ <span id="todayLabel"></span></div></header>
  <section class="hero"><small id="heroLabel">Overall စုစုပေါင်း</small><h2 id="heroNet">0 ကျပ်</h2><div class="sub" id="heroSub">Cash Flow</div></section>
  <section class="grid"><div class="card metric income"><label>စုစုပေါင်းဝင်ငွေ</label><b id="incomeTotal">0</b><span class="hint">ကျပ်</span></div><div class="card metric expense"><label>စုစုပေါင်းထွက်ငွေ</label><b id="expenseTotal">0</b><span class="hint">ကျပ်</span></div></section>

  <section class="section"><div class="section-head"><div><h3>Dashboard</h3><span class="hint">ရွေးထားသောကာလနှင့် လစဉ်အခြေအနေ</span></div><span id="health" class="health green">အခြေအနေကောင်း</span></div>
    <div class="panel">
      <div class="focus"><div><b id="focusLabel">Overall စုစုပေါင်း</b><div class="hint">ရွေးထားသောကာလ</div></div><div class="amounts"><span class="positive" id="focusIncome">ဝင် 0</span><br><span class="negative" id="focusExpense">ထွက် 0</span></div></div>
      <div class="section-head" style="margin-top:14px"><b>Budget</b><div class="toggle"><button id="monthlyMode" class="active">လစဉ်</button><button id="dailyMode">နေ့စဉ်</button></div></div>
      <div class="budget-top"><div><b id="budgetLabel">လစဉ်အသုံးစရိတ် Budget</b><div class="hint" id="budgetValue">မသတ်မှတ်ရသေးပါ</div></div><button id="budgetBtn">သတ်မှတ်မယ်</button></div><div class="progress"><i id="budgetBar" style="width:0%"></i></div>
      <div class="section-head" style="margin-top:16px"><b id="categoryTitle">Overall အသုံးစရိတ်အမျိုးအစား</b><span class="hint">အများဆုံးမှ အနည်းဆုံး</span></div><div id="categoryBars"></div>
    </div>
  </section>

  <section class="section"><div class="section-head"><div><h3>ကာလရွေးချယ်ရန်</h3><span class="hint">ရွေးပြီး OK နှိပ်မှ Dashboard ပြောင်းမည်</span></div></div><div class="panel"><div class="filter-row" id="filterChips"></div><div id="customBox" class="custom" hidden><label class="field">စတင်ရက်<input id="fromDate" placeholder="DD-MMM-YYYY"></label><label class="field">ပြီးဆုံးရက်<input id="toDate" placeholder="DD-MMM-YYYY"></label></div><div class="actions"><button id="applyFilter" class="primary">✓ OK — အတည်ပြုမယ်</button></div><div id="filterError" class="negative" style="font-size:11px;margin-top:7px"></div></div></section>

  <section class="section"><div class="section-head"><div><h3>Cash Flow မှတ်တမ်း</h3><span class="hint" id="rangeLabel"></span></div><button id="addRecordBtn" class="green">＋ မှတ်တမ်း</button></div><div id="records" class="panel"></div></section>

  <section class="section"><div class="section-head"><div><h3>ခရီးစဉ် Budget</h3><span class="hint">ကြိုထုတ်ငွေ နှင့် သုံးငွေကွာခြားချက်</span></div></div><div class="panel"><form id="tripForm"><div class="form-grid"><label class="field">ခရီးစဉ်အမည်<input id="tripName" required placeholder="ဥပမာ မန္တလေးခရီး"></label><label class="field">ကြိုထုတ်ငွေ<input id="tripAdvance" type="number" min="1" required placeholder="400000"></label><label class="field">ခရီးစရိတ်<input id="tripTravel" type="number" min="0" value="0"></label><label class="field">စားစရိတ်<input id="tripFood" type="number" min="0" value="0"></label><label class="field">တည်းခိုစရိတ်<input id="tripLodging" type="number" min="0" value="0"></label><label class="field">Taxi ငှားခ<input id="tripTaxi" type="number" min="0" value="0"></label><label class="field">အခြားစရိတ်<input id="tripOther" type="number" min="0" value="0"></label></div><div class="form-actions"><button class="primary" type="submit">ခရီးစဉ်တွက်ပြီး သိမ်းမယ်</button></div></form><div id="trips" style="margin-top:10px"></div></div></section>

  <section class="section"><div class="section-head"><div><h3>မှတ်တမ်းအသစ်</h3><span class="hint">ဝင်ငွေ / ထွက်ငွေ ထည့်ရန်</span></div></div><div class="panel"><form id="recordForm"><div class="form-grid"><label class="field">အမျိုးအစား<select id="recordType"><option value="expense">ထွက်ငွေ</option><option value="income">ဝင်ငွေ</option></select></label><label class="field">ပမာဏ<input id="recordAmount" type="number" min="1" required></label><label class="field">အမျိုးအစားအမည်<input id="recordCategory" required placeholder="စားစရိတ်"></label><label class="field">ရက်စွဲ<input id="recordDate" type="date" required></label><label class="field full">မှတ်ချက်<textarea id="recordNote" rows="2" placeholder="မှတ်ချက် (ရွေးချယ်နိုင်)"></textarea></label></div><div class="form-actions"><button class="green" type="submit">မှတ်တမ်းသိမ်းမယ်</button></div></form></div></section>
</main>
<script>
const KEY='auto-cash-flow-datapad-v1', MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const todayKey=()=>{const d=new Date();return d.toISOString().slice(0,10)};const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>{const [y,m,day]=d.split('-');return `${day}-${MONTHS[+m-1]}-${y}`};
const fmt=n=>Number(n||0).toLocaleString('en-US');const month=d=>d.slice(0,7);const valid=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(new Date(d+'T00:00:00').getTime());
const isoFromDisplay=s=>{let x=s.trim();if(valid(x))return x;const m=x.match(/^(\d{2})-([A-Za-z]{3})-(\d{4})$/);if(!m)return x;const i=MONTHS.findIndex(v=>v.toLowerCase()===m[2].toLowerCase());const out=`${m[3]}-${pad(i+1)}-${m[1]}`;return valid(out)?out:x};
const addDays=(key,n)=>{const d=new Date(key+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{records:[],trips:[],monthly:{},daily:{}};
if(!db.records.length){const t=todayKey();db.records=[{id:crypto.randomUUID(),type:'income',amount:185000,category:'လစာ',date:t,note:'လစဉ်ဝင်ငွေ'},{id:crypto.randomUUID(),type:'expense',amount:12500,category:'စားစရိတ်',date:t,note:'နေ့စဉ်စားစရိတ်'},{id:crypto.randomUUID(),type:'expense',amount:8000,category:'သွားလာစရိတ်',date:addDays(t,-1),note:'Taxi'}];save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const totals=(from,to)=>db.records.filter(r=>r.date>=from&&r.date<=to).reduce((a,r)=>{a[r.type]+=+r.amount;return a},{income:0,expense:0});
const allDates=db.records.map(r=>r.date).sort();
let applied={kind:'all',from:allDates[0]||todayKey(),to:allDates.at(-1)||todayKey()},draft={...applied};let budgetMode='monthly';
const periodNames={all:'Overall စုစုပေါင်း',today:'ဒီနေ့',week:'တပတ်စာ',month30:'ရက် ၃၀စာ',custom:'ရွေးထားသောကာလ'};
const chips=[['all','Overall'],['today','ဒီနေ့'],['week','၇ ရက်'],['month30','၃၀ ရက်'],['custom','Custom']];
function rangeFor(k){const t=todayKey();if(k==='today')return{from:t,to:t};if(k==='week')return{from:addDays(t,-6),to:t};if(k==='month30')return{from:addDays(t,-29),to:t};return{from:allDates[0]||t,to:allDates.at(-1)||t}}
function selectedRange(){return applied.kind==='custom'?{from:applied.from,to:applied.to}:rangeFor(applied.kind)}
function renderChips(){document.querySelector('#filterChips').innerHTML=chips.map(([k,l])=>`<button class="chip ${draft.kind===k?'active':''}" data-k="${k}">${l}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{draft.kind=b.dataset.k;document.querySelector('#customBox').hidden=draft.kind!=='custom';renderChips()})}
function render(){const r=selectedRange(),t=totals(r.from,r.to),today=todayKey(),monthT=totals(today.slice(0,7)+'-01',today);const single=r.from===r.to;const label=single?fmtDate(r.from):applied.kind==='all'?'Overall စုစုပေါင်း':`${fmtDate(r.from)} — ${fmtDate(r.to)}`;document.querySelector('#todayLabel').textContent=fmtDate(today);document.querySelector('#heroLabel').textContent=label;document.querySelector('#heroNet').textContent=fmt(t.income-t.expense)+' ကျပ်';document.querySelector('#heroSub').textContent=`Cash Flow • ဝင် ${fmt(t.income)} / ထွက် ${fmt(t.expense)}`;document.querySelector('#incomeTotal').textContent=fmt(t.income);document.querySelector('#expenseTotal').textContent=fmt(t.expense);document.querySelector('#focusLabel').textContent=label;document.querySelector('#focusIncome').textContent='ဝင် '+fmt(t.income);document.querySelector('#focusExpense').textContent='ထွက် '+fmt(t.expense);document.querySelector('#rangeLabel').textContent=`${fmtDate(r.from)} — ${fmtDate(r.to)}`;document.querySelector('#categoryTitle').textContent=label+' အသုံးစရိတ်အမျိုးအစား';
 const b=budgetMode==='monthly'?db.monthly[month(today)]:(db.daily[r.from]||db.daily[today]);const spent=budgetMode==='monthly'?monthT.expense:t.expense;const progress=b?Math.min(100,spent/b*100):0;document.querySelector('#budgetLabel').textContent=budgetMode==='monthly'?'လစဉ်အသုံးစရိတ် Budget':`${fmtDate(r.from)} နေ့စဉ် Budget`;document.querySelector('#budgetValue').textContent=b?`${fmt(spent)} / ${fmt(b)} ကျပ်`:'မသတ်မှတ်ရသေးပါ';document.querySelector('#budgetBar').style.width=progress+'%';document.querySelector('#budgetBar').className=progress>=100?'danger':progress>=80?'warn':'';document.querySelector('#budgetBtn').textContent=b?'ပြင်မယ်':'သတ်မှတ်မယ်';
 const health=document.querySelector('#health');health.className='health '+(b?(spent>b?'red':spent>=b*.8?'amber':'green'):(t.expense>t.income?'red':'green'));health.textContent=b?(spent>b?'Budget ကျော်နေသည်':spent>=b*.8?'သတိထားရန်':'အခြေအနေကောင်း'):(t.expense>t.income?'အသုံးစရိတ်များနေ':'အခြေအနေကောင်း');
 const cats={};db.records.filter(x=>x.type==='expense'&&x.date>=r.from&&x.date<=r.to).forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);const arr=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6),max=arr[0]?.[1]||1;document.querySelector('#categoryBars').innerHTML=arr.length?arr.map(([n,v])=>`<div class="bar-row"><span>${n}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">အသုံးစရိတ် မရှိသေးပါ</div>';
 const rs=db.records.filter(x=>x.date>=r.from&&x.date<=r.to).sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#records').innerHTML=rs.length?rs.map(x=>`<div class="record"><div><b>${x.category}</b><small>${fmtDate(x.date)}${x.note?' • '+x.note:''}</small></div><div><div class="amount ${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'-'}${fmt(x.amount)}</div><div class="tools"><button onclick="editRecord('${x.id}')">ပြင်</button><button class="danger-btn" onclick="deleteRecord('${x.id}')">ဖျက်</button></div></div></div>`).join(''):'<div class="empty">ဒီကာလအတွက် မှတ်တမ်းမရှိပါ</div>';renderTrips();renderChips()}
function renderTrips(){document.querySelector('#trips').innerHTML=db.trips.length?db.trips.map((x,i)=>{const spent=x.travel+x.food+x.lodging+x.taxi+x.other;const diff=x.advance-spent;return `<div class="trip"><div><b>${x.name}</b><small>ခရီးစဉ်အသုံးစရိတ် အကျဉ်းချုပ်</small><div class="trip-stats"><div>ကြိုထုတ်<b>${fmt(x.advance)}</b></div><div>သုံးငွေ<b>${fmt(spent)}</b></div><div>ကွာခြားချက်<b class="${diff>=0?'positive':'negative'}">${fmt(Math.abs(diff))} ${diff>=0?'လက်ကျန်':'ပိုသုံး'}</b></div></div></div><button class="danger-btn" onclick="db.trips.splice(${i},1);save();render()">ဖျက်</button></div>`}).join(''):'<div class="empty">ခရီးစဉ် Budget မရှိသေးပါ</div>'}
function editRecord(id){const r=db.records.find(x=>x.id===id);if(!r)return;document.querySelector('#recordType').value=r.type;document.querySelector('#recordAmount').value=r.amount;document.querySelector('#recordCategory').value=r.category;document.querySelector('#recordDate').value=r.date;document.querySelector('#recordNote').value=r.note||'';db.records=db.records.filter(x=>x.id!==id);save();render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function deleteRecord(id){if(confirm('ဒီမှတ်တမ်းကို ဖျက်မလား?')){db.records=db.records.filter(x=>x.id!==id);save();render()}}
document.querySelector('#applyFilter').onclick=()=>{const e=document.querySelector('#filterError');if(draft.kind==='custom'){const f=isoFromDisplay(document.querySelector('#fromDate').value),to=isoFromDisplay(document.querySelector('#toDate').value);if(!valid(f)||!valid(to)||f>to){e.textContent='ရက်စွဲကို DD-MMM-YYYY ပုံစံဖြင့် မှန်ကန်စွာထည့်ပါ';return}applied={kind:'custom',from:f,to:to}}else applied={kind:draft.kind,...rangeFor(draft.kind)};e.textContent='';render()};
document.querySelector('#monthlyMode').onclick=()=>{budgetMode='monthly';document.querySelector('#monthlyMode').classList.add('active');document.querySelector('#dailyMode').classList.remove('active');render()};document.querySelector('#dailyMode').onclick=()=>{budgetMode='daily';document.querySelector('#dailyMode').classList.add('active');document.querySelector('#monthlyMode').classList.remove('active');render()};document.querySelector('#budgetBtn').onclick=()=>{const key=budgetMode==='monthly'?month(todayKey()):selectedRange().from;const old=budgetMode==='monthly'?db.monthly[month(todayKey())]:(db.daily[key]||'');const n=prompt(`${budgetMode==='monthly'?'လစဉ်':'နေ့စဉ်'} Budget ပမာဏ (ကျပ်)`,old||'');if(n!==null&&Number(n)>0){if(budgetMode==='monthly')db.monthly[month(todayKey())]=Math.round(Number(n));else db.daily[key]=Math.round(Number(n));save();render()}};
document.querySelector('#recordForm').onsubmit=e=>{e.preventDefault();db.records.push({id:crypto.randomUUID(),type:recordType.value,amount:Math.round(Number(recordAmount.value)),category:recordCategory.value.trim(),date:recordDate.value,note:recordNote.value.trim()});save();e.target.reset();recordDate.value=todayKey();render()};
document.querySelector('#tripForm').onsubmit=e=>{e.preventDefault();db.trips.unshift({name:tripName.value.trim(),advance:+tripAdvance.value,travel:+tripTravel.value||0,food:+tripFood.value||0,lodging:+tripLodging.value||0,taxi:+tripTaxi.value||0,other:+tripOther.value||0});save();e.target.reset();render()};
document.querySelector('#recordDate').value=todayKey();render();
</script>
</body>
</html>
