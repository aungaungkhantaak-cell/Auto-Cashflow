workflows:
  android-release:
    name: Auto-Cashflow Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22.14.0
      java: 17
      android_signing:
        - YOUR_KEYSTORE_REFERENCE

    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile

      - name: Check Auto-Cashflow source
        script: |
          pnpm check
          pnpm exec eslint 'app/**/*.{ts,tsx}' 'components/**/*.{ts,tsx}' 'hooks/**/*.{ts,tsx}' 'lib/**/*.{ts,tsx}' app.config.ts

      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --non-interactive

      - name: Add Codemagic signing properties
        script: |
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=${CM_KEYSTORE_PATH}
          MYAPP_UPLOAD_STORE_PASSWORD=${CM_KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_ALIAS=${CM_KEY_ALIAS}
          MYAPP_UPLOAD_KEY_PASSWORD=${CM_KEY_PASSWORD}
          EOF

      - name: Build Auto-Cashflow APK and AAB
        script: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

  android-debug-apk:
    name: Auto-Cashflow Debug APK
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      node: 22.14.0
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile

      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --non-interactive

      - name: Build Auto-Cashflow debug APK
        script: |
          cd android
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
