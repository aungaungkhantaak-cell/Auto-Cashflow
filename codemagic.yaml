workflows:
  android-release:
    name: Auto Cash Flow Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22.14.0
      java: 17
      groups:
        - cashflow_keystore
      vars:
        PACKAGE_NAME: space.manus.cashflow.t164614231327334
        APP_VERSION_NAME: 1.0.0
      # Replace this with the signing identity reference created in Codemagic.
      android_signing:
        - cashflow_android_keystore

    scripts:
      - name: Install pnpm and project dependencies
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile

      - name: Check TypeScript and lint
        script: |
          pnpm check
          pnpm exec eslint 'app/**/*.{ts,tsx}' 'components/**/*.{ts,tsx}' 'hooks/**/*.{ts,tsx}' 'lib/**/*.{ts,tsx}'

      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --non-interactive

      - name: Configure Android release signing
        script: |
          # Codemagic exposes these values when android_signing is configured:
          # CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
          # Expo's generated Gradle project reads these MYAPP_UPLOAD_* properties.
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=${CM_KEYSTORE_PATH}
          MYAPP_UPLOAD_STORE_PASSWORD=${CM_KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_ALIAS=${CM_KEY_ALIAS}
          MYAPP_UPLOAD_KEY_PASSWORD=${CM_KEY_PASSWORD}
          EOF

      - name: Build signed APK and AAB
        script: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

  android-debug-apk:
    name: Auto Cash Flow Debug APK
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      node: 22.14.0
      java: 17
      vars:
        PACKAGE_NAME: space.manus.cashflow.t164614231327334

    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile

      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        script: |
          cd android
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
